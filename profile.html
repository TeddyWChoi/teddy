<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>배우 프로필 | 최테디 - Teddy Choi</title>
  <meta name="description" content="배우 최테디 프로필 — 연기 경력, 특기, 연락처">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #ffffff;
      --ink: #141416;
      --ink-sub: #5c5c64;
      --ink-dim: #9b9ba2;
      --line: #ececef;
      --sans: 'Noto Sans KR', -apple-system, sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body {
      background: #ebebee;
      font-family: var(--sans);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    /* ===== 상단 툴바 (화면 전용) ===== */
    .toolbar {
      position: sticky; top: 0; z-index: 50;
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; flex-wrap: wrap;
      padding: 13px 22px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }
    .toolbar-title { font-size: 0.95rem; font-weight: 700; letter-spacing: 0.02em; }
    .toolbar-actions { display: flex; gap: 9px; }
    .tb-btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 9px 18px; border-radius: 999px;
      font-family: var(--sans); font-size: 0.84rem; font-weight: 500;
      letter-spacing: 0.02em; cursor: pointer; text-decoration: none;
      transition: all 0.2s ease; border: 1px solid #d9d9df;
      color: var(--ink-sub); background: transparent;
    }
    .tb-btn:hover { border-color: var(--ink); color: var(--ink); }
    .tb-btn.primary { background: var(--ink); border-color: var(--ink); color: #fff; font-weight: 600; }
    .tb-btn.primary:hover { background: #000; }
    .tb-btn.primary[disabled] { opacity: 0.55; cursor: progress; }
    .tb-btn svg { width: 15px; height: 15px; fill: currentColor; }

    /* ===== 페이지 공통 (A4 가로) ===== */
    .sheets-zoom { padding: 34px 16px 70px; }
    .sheets { width: 1123px; margin: 0 auto; }
    .page {
      width: 1123px; height: 794px; overflow: hidden; position: relative;
      background: var(--paper);
      margin: 0 auto 30px;
      box-shadow: 0 10px 40px rgba(30, 30, 40, 0.13);
      page-break-after: always; break-after: page;
    }
    .page:last-child { margin-bottom: 0; }
    .sheets.capturing .page { margin: 0; box-shadow: none; }

    .page-mark {
      position: absolute; bottom: 24px; left: 64px; right: 64px;
      display: flex; justify-content: space-between;
      font-size: 0.6rem; color: #c2c2c8; letter-spacing: 0.12em;
    }

    /* ===== PAGE 1 — 커버 ===== */
    .cover { display: flex; height: 100%; }
    .cover-left {
      width: 45%; height: 100%; flex-shrink: 0;
      display: flex; flex-direction: column;
      padding: 56px 56px 64px 64px;
    }
    .qr-wrap { width: 88px; text-align: center; }
    .qr-box { width: 88px; height: 88px; }
    .qr-box img, .qr-box canvas { width: 88px !important; height: 88px !important; }
    .qr-label { display: block; margin-top: 8px; font-size: 0.58rem; letter-spacing: 0.22em; color: var(--ink-dim); }

    .cover-name-block { margin-top: auto; }
    .cover-name { font-size: 2.1rem; font-weight: 900; letter-spacing: 0.01em; }
    .cover-birth { font-size: 0.88rem; color: var(--ink-dim); margin-top: 8px; }
    .cover-tagline { font-size: 0.8rem; color: var(--ink-sub); margin-top: 14px; line-height: 1.7; }

    .cover-rows { margin-top: auto; display: flex; flex-direction: column; gap: 13px; }
    .cv-row { display: flex; gap: 18px; font-size: 0.84rem; line-height: 1.65; }
    .cv-label { width: 96px; flex-shrink: 0; font-weight: 700; letter-spacing: 0.02em; }
    .cv-value { color: #333338; }
    .cv-value .sub { display: block; color: var(--ink-dim); font-size: 0.76rem; }

    .cover-right { flex: 1; height: 100%; }
    .cover-right img { width: 100%; height: 100%; object-fit: cover; object-position: center top; display: block; }

    /* ===== PAGE 2 — 경력 ===== */
    .career-page { display: flex; height: 100%; padding: 52px 64px 56px; gap: 52px; }
    .career-photo-col { width: 36%; flex-shrink: 0; display: flex; flex-direction: column; }
    .career-photo-col .main-photo { flex: 1; min-height: 0; }
    .career-photo-col img { width: 100%; height: 100%; object-fit: cover; object-position: center 12%; display: block; }
    .photo-cap { font-size: 0.62rem; color: var(--ink-dim); letter-spacing: 0.06em; margin-top: 7px; }

    .career-col { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    .credit-group { display: flex; gap: 26px; }
    .credit-group + .credit-group { margin-top: 26px; }
    .cg-label { width: 64px; flex-shrink: 0; font-size: 0.84rem; font-weight: 700; padding-top: 2px; }
    .cg-list { flex: 1; }
    .cg-item { display: flex; gap: 12px; align-items: baseline; font-size: 0.82rem; line-height: 2.05; }
    .cg-year { color: var(--ink-dim); font-size: 0.74rem; width: 26px; flex-shrink: 0; }
    .cg-title { font-weight: 700; }
    .cg-role { color: var(--ink-sub); font-size: 0.76rem; }

    .career-photos-bottom { margin-top: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding-top: 28px; }
    .career-photos-bottom figure { overflow: hidden; }
    .career-photos-bottom img { width: 100%; height: 218px; object-fit: cover; display: block; }
    img.pos-top { object-position: center 10%; }

    /* ===== PAGE 3 — 사진 ===== */
    .stage-page { height: 100%; padding: 52px 64px 58px; display: flex; flex-direction: column; }
    .stage-grid {
      flex: 1; min-height: 0;
      display: grid; grid-template-columns: repeat(4, 1fr);
      grid-template-rows: 1fr 1fr; gap: 12px;
    }
    .stage-grid figure { display: flex; flex-direction: column; min-height: 0; }
    .stage-grid figure.tall { grid-row: span 2; }
    .stage-grid .imgwrap { flex: 1; min-height: 0; overflow: hidden; background: #f4f4f6; }
    .stage-grid img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .stage-grid figcaption { padding-top: 6px; font-size: 0.6rem; color: var(--ink-dim); letter-spacing: 0.05em; }

    /* ===== 인쇄 (A4 가로) ===== */
    @page { size: A4 landscape; margin: 0; }
    @media print {
      body { background: var(--paper); }
      .toolbar { display: none; }
      .sheets-zoom { padding: 0; zoom: 1 !important; }
      .sheets { width: auto; }
      .page { width: 296.6mm; height: 209.6mm; margin: 0; box-shadow: none; }
    }
  </style>
</head>
<body>

  <div class="toolbar">
    <span class="toolbar-title">최테디 — 배우 프로필</span>
    <div class="toolbar-actions">
      <a class="tb-btn" href="index.html">← 포트폴리오 사이트</a>
      <button class="tb-btn primary" id="pdfBtn" type="button">
        <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
        PDF 다운로드
      </button>
    </div>
  </div>

  <div class="sheets-zoom" id="sheetsZoom">
  <div class="sheets" id="sheets">

    <!-- ===== PAGE 1 — 커버 ===== -->
    <section class="page">
      <div class="cover">
        <div class="cover-left">
          <div class="qr-wrap">
            <div class="qr-box" id="qrBox"></div>
            <span class="qr-label">PORTFOLIO</span>
          </div>

          <div class="cover-name-block">
            <h1 class="cover-name">최테디 <span style="font-weight:300; font-size:1.1rem; color:var(--ink-dim); letter-spacing:0.14em;">Teddy Choi</span></h1>
            <p class="cover-birth" id="infoBirthBody"></p>
            <p class="cover-tagline" id="coverTagline"></p>
          </div>

          <div class="cover-rows">
            <div class="cv-row"><span class="cv-label">연락처</span><span class="cv-value" id="infoPhone"></span></div>
            <div class="cv-row"><span class="cv-label">이메일</span><span class="cv-value" id="infoEmail"></span></div>
            <div class="cv-row"><span class="cv-label">인스타그램</span><span class="cv-value" id="infoInsta"></span></div>
            <div class="cv-row"><span class="cv-label">학력</span><span class="cv-value" id="infoEdu"></span></div>
            <div class="cv-row"><span class="cv-label">특기 · 취미</span><span class="cv-value" id="infoSkills"></span></div>
          </div>
        </div>
        <div class="cover-right">
          <img src="images/profile_main.jpeg" alt="배우 최테디 프로필 사진">
        </div>
      </div>
    </section>

    <!-- ===== PAGE 2 — 연기 경력 ===== -->
    <section class="page">
      <div class="career-page">
        <div class="career-photo-col">
          <figure class="main-photo"><img src="images/portrait_red.jpg" alt="배우 최테디 일상 컷"></figure>
          <p class="photo-cap">일상 컷</p>
        </div>
        <div class="career-col">
          <div id="creditGroups"></div>
          <div class="career-photos-bottom">
            <figure>
              <img src="images/stage_performance1.jpeg" alt="도슨트 공연 민주의 물결">
              <p class="photo-cap">도슨트 공연 〈민주의 물결〉</p>
            </figure>
            <figure>
              <img src="images/musical_costume2.jpeg" alt="뮤지컬 위대한쇼맨" style="object-position: center 52%;">
              <p class="photo-cap">뮤지컬 〈위대한쇼맨〉 · 찰스 역</p>
            </figure>
          </div>
        </div>
      </div>
      <div class="page-mark"><span>TEDDY CHOI — ACTOR PROFILE</span><span>2 / 3</span></div>
    </section>

    <!-- ===== PAGE 3 — 무대 사진 ===== -->
    <section class="page">
      <div class="stage-page">
        <div class="stage-grid">
          <figure class="tall"><div class="imgwrap"><img src="images/portrait_bw_fit.jpg" alt="프로필 촬영"></div><figcaption>프로필 촬영</figcaption></figure>
          <figure><div class="imgwrap"><img src="images/works/last-rehearsal/rehearsal_standing.jpg" alt="연극 마지막 리허설" style="object-position: center 15%;"></div><figcaption>연극 〈마지막 리허설〉 · 김청년 역</figcaption></figure>
          <figure class="tall"><div class="imgwrap"><img src="images/works/fitness/fitness_04.jpg" alt="바디 프로필"></div><figcaption>바디 프로필</figcaption></figure>
          <figure><div class="imgwrap"><img src="images/stage_play1.jpeg" alt="연극 처녀비행"></div><figcaption>연극 〈처녀비행〉</figcaption></figure>
          <figure><div class="imgwrap"><img src="images/band_live.jpg" alt="밴드 공연 보컬"></div><figcaption>밴드 공연 · 보컬 &amp; 기타</figcaption></figure>
          <figure><div class="imgwrap"><img class="pos-top" src="images/works/murder/murder_05.jpg" alt="창작연극 머더 커튼콜"></div><figcaption>연극 〈머더〉 커튼콜 · 강식 역</figcaption></figure>
        </div>
      </div>
      <div class="page-mark"><span>TEDDY CHOI — ACTOR PROFILE</span><span>3 / 3</span></div>
    </section>

  </div>
  </div>

  <script src="profile-data.js?v=4"></script>
  <script>
    (function () {
      const D = PROFILE_DATA;
      const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

      document.getElementById("infoBirthBody").textContent = D.birth + " · " + D.bodySpec;
      document.getElementById("coverTagline").innerHTML = D.tagline;
      document.getElementById("infoPhone").textContent = D.phone;
      document.getElementById("infoEmail").textContent = D.email;
      document.getElementById("infoInsta").textContent = D.instagram;
      document.getElementById("infoEdu").innerHTML =
        esc(D.education[0]) + "<br>" + esc(D.education[1]) +
        '<span class="sub">' + esc(D.education[2]) + "</span>";
      document.getElementById("infoSkills").innerHTML =
        D.skills.map(s => esc(s.name)).join(", ") +
        '<span class="sub">' + esc(D.skills[0].detail) + " / " + esc(D.skills[2].detail) + "</span>";

      /* 경력을 연극 / 뮤지컬 / 공연으로 분류해 렌더링 */
      const groupOf = c =>
        /뮤지컬/.test(c.title) ? "뮤지컬" :
        /(도슨트|춤극|독백극)/.test(c.title) ? "공연" : "연극";
      const shortTitle = t => t.replace(/^[^〈]*〈/, "〈").replace(/〉[^〉]*$/, "〉");
      const yearOf = d => d.slice(2, 4) + "'";
      const groups = { "연극": [], "뮤지컬": [], "공연": [] };
      D.career.forEach(c => groups[groupOf(c)].push(c));
      document.getElementById("creditGroups").innerHTML =
        Object.entries(groups).filter(([, list]) => list.length).map(([label, list]) => `
          <div class="credit-group">
            <span class="cg-label">${label}</span>
            <div class="cg-list">
              ${list.map(c => `
                <div class="cg-item">
                  <span class="cg-year">${yearOf(c.date)}</span>
                  <span class="cg-title">${esc(shortTitle(c.title))}</span>
                  <span class="cg-role">${esc(c.role)}${/예정/.test(c.date) ? " (예정)" : ""}</span>
                </div>`).join("")}
            </div>
          </div>`).join("");

      /* QR — 포트폴리오 사이트 (라이브러리 로드 후 생성) */
      window.addEventListener("load", () => {
        if (window.QRCode) {
          new QRCode(document.getElementById("qrBox"), {
            text: D.siteUrl, width: 88, height: 88,
            colorDark: "#141416", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M
          });
        }
      });

      /* 작은 화면: 비율 유지 축소 */
      const zoomWrap = document.getElementById("sheetsZoom");
      function fitZoom() {
        const avail = Math.min(window.innerWidth, document.documentElement.clientWidth) - 24;
        zoomWrap.style.zoom = avail < 1123 ? (avail / 1123) : 1;
      }
      fitZoom();
      window.addEventListener("resize", fitZoom);

      /* ===== PDF 다운로드 (페이지별 캡처 → A4 가로 3장) ===== */
      const btn = document.getElementById("pdfBtn");
      btn.addEventListener("click", async () => {
        if (typeof html2canvas === "undefined" || !window.jspdf) { window.print(); return; }
        const label = btn.innerHTML;
        btn.disabled = true;
        btn.textContent = "PDF 생성 중…";
        const prevZoom = zoomWrap.style.zoom;
        zoomWrap.style.zoom = 1;
        const sheets = document.getElementById("sheets");
        sheets.classList.add("capturing");
        try {
          const { jsPDF } = window.jspdf;
          const pdf = new jsPDF({ unit: "px", format: [1123, 794], orientation: "landscape", hotfixes: ["px_scaling"] });
          const pages = sheets.querySelectorAll(".page");
          for (let i = 0; i < pages.length; i++) {
            const canvas = await html2canvas(pages[i], {
              scale: 2, useCORS: true, backgroundColor: "#ffffff", scrollY: 0
            });
            if (i) pdf.addPage([1123, 794], "landscape");
            pdf.addImage(canvas.toDataURL("image/jpeg", 0.93), "JPEG", 0, 0, 1123, 794);
          }
          pdf.save("최테디_배우프로필.pdf");
        } catch (e) {
          window.print();
        } finally {
          sheets.classList.remove("capturing");
          zoomWrap.style.zoom = prevZoom;
          btn.disabled = false;
          btn.innerHTML = label;
        }
      });
    })();
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
</body>
</html>
